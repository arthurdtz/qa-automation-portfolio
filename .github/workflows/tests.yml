name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check API key secret
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "::error::Missing REQRES_API_KEY secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Run API tests
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: pytest api_tests/ -v --html=reports/api-report.html --self-contained-html

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-report
          path: reports/api-report.html

  ui-tests:
    name: UI tests (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UI tests
        run: pytest ui_tests/ -v --html=reports/ui-report.html --self-contained-html

      - name: Upload UI report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-report
          path: reports/ui-report.html
